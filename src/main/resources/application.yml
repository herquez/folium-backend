spring:
  application:
    name: ${APPLICATION_NAME}
  config:
    import: optional:file:.env
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.enable_lazy_load_no_trans: true